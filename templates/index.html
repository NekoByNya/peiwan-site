<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 下面这些双花括号占位符由 app.py 填进去，微信/QQ 分享出去才有标题和简介 -->
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{NAME}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{OG_URL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0d0b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🐾</text></svg>">
<link rel="stylesheet" href="/static/style.css">
{{THEME_STYLE}}
</head>
<body data-mode="home">

<!-- ============ 顶部导航 ============ -->
<header class="nav">
  <div class="container nav-inner">
    <a class="brand" href="/"><span id="brandMark">Nya</span> <span id="brandName">·</span></a>
    <nav class="nav-links" id="navLinks">
      <a href="#services">我能做什么</a>
      <a href="#trust">为什么找我</a>
      <a href="#about">关于我</a>
    </nav>
  </div>
</header>

<!-- ============ 首屏：品牌 + 我能做什么 + 加微信 ============ -->
<section class="hero container">
  <div class="hero-grid" id="heroGrid">
    <div class="hero-copy">
      <span class="eyebrow" id="heroEyebrow">加载中…</span>
      <h1 id="heroHeadline">—</h1>
      <p class="tagline" id="heroSub"></p>
      <div class="hero-actions">
        <a class="button primary" href="#services">看看我能做什么</a>
        <button class="button" id="copyWechat">加微信</button>
        <span class="status-dot" id="acceptingDot"><i></i><span id="acceptingText">—</span></span>
      </div>
      <!-- 微信号直接显示出来：微信内置浏览器经常不允许自动复制，客户还能长按选中 -->
      <p class="wechat-line" id="wechatLine"></p>
    </div>
    <!-- 首屏图：优先用第一个分区的首屏主视觉，没有就整块隐藏 -->
    <div class="hero-media" id="heroMedia" hidden></div>
  </div>
</section>

<!-- ============ 服务区：按大类分组的分区卡片 ============ -->
<section class="section" id="services">
  <div class="container">
    <div class="section-head">
      <div>
        <div class="section-no">01 / WHAT I DO</div>
        <h2 id="servicesTitle">我能做什么</h2>
      </div>
      <p id="servicesHint">点开看详情与价目</p>
    </div>
    <div id="serviceGroups"></div>
  </div>
</section>

<!-- ============ 信任信号 ============ -->
<section class="section" id="trust">
  <div class="container">
    <div class="section-head">
      <div>
        <div class="section-no">02 / WHY ME</div>
        <h2>为什么找我。</h2>
      </div>
      <p>个人接单 · 无中间商</p>
    </div>
    <div class="trust-grid" id="trustList"></div>
  </div>
</section>

<!-- ============ 关于我 ============ -->
<section class="section" id="about">
  <div class="container">
    <div class="section-head">
      <div>
        <div class="section-no">03 / ABOUT</div>
        <h2>你好，我是 <span id="aboutName">—</span>。</h2>
      </div>
      <p id="aboutHint"></p>
    </div>
    <div class="about-grid">
      <div id="avatarBox"></div>
      <div>
        <p id="aboutBio" style="white-space:pre-line;margin-top:0"></p>
        <div class="wechat-card" id="wechatCard" hidden>
          <img id="wechatQrImg" alt="微信二维码" hidden>
          <div>
            <p class="hint" style="margin:0">加我微信，直接聊需求</p>
            <p class="wechat-big" id="wechatBig"></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ 底部 CTA ============ -->
<footer class="footer">
  <!-- 页脚 = 真正读完这页的人的出口。二维码 + 微信号 + 一个按钮，别重复首屏那两个按钮 -->
  <div class="container footer-cta">
    <div>
      <p class="footer-big" id="footerName"></p>
      <p class="hint" id="footerHint"></p>
    </div>
    <button class="button primary" id="footerWechat">复制微信号</button>
  </div>
  <div class="container footer-wechat">
    <img id="footerQr" alt="我的微信二维码" hidden>
    <div class="footer-wechat-text">
      <p class="done-wechat-id">微信号：<b id="footerWechatId"></b></p>
      <p class="hint" id="footerQrCaption" hidden>长按上面的二维码就能加我（部分浏览器支持）</p>
      <p class="hint" id="footerTip">加我之后直接说：哪个游戏 / 哪一档，我来安排。</p>
    </div>
  </div>
  <div class="container">
    <p id="footerZone"></p>
    <p>本页为个人服务页面，与游戏官方无隶属关系；游戏素材版权归原权利人所有。</p>
  </div>
</footer>

<!-- 复制失败时的兜底弹窗（微信内置浏览器很常见），让客户长按手动复制 -->
<div class="modal-mask" id="copyModal">
  <div class="modal">
    <h3>长按下面的文字复制</h3>
    <p class="modal-sub">你的浏览器不允许网页自动复制，请长按选中后点系统的「复制」。</p>
    <textarea class="message" id="copyTextBox" readonly style="min-height:130px"></textarea>
    <div class="modal-actions">
      <button class="button primary" id="selectAllCopy">全选这段文字</button>
      <button class="button ghost" id="closeCopyModal">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>window.__PAGE__ = {{PAGE_JSON}};window.__ZONE_ID__ = "{{ZONE_ID}}";</script>
<script src="/static/site.js"></script>
</body>
</html>
